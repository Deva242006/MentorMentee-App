spring.application.name=MentorMentee
server.port=8081

# ---- MongoDB ----
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/mentortrack}
spring.data.mongodb.auto-index-creation=true

# ---- File uploads (GridFS) ----
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# ---- JWT (HMAC-SHA256). Override the secret in production. ----
app.jwt.secret=${JWT_SECRET:change-me-to-a-long-random-secret-value-at-least-32-bytes-long}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:720}

# ---- CORS / frontend ----
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# ---- Seed admin (created on first startup if missing) ----
app.admin.email=${ADMIN_EMAIL:admin@mentortrack.local}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.name=${ADMIN_NAME:Administrator}
# Set to true once to also seed a demo mentor + mentee
app.seed-demo-data=${SEED_DEMO_DATA:true}

# ---- Google Forms integration (disabled until credentials are provided) ----
google.forms.enabled=${GOOGLE_FORMS_ENABLED:false}
google.forms.client-id=${GOOGLE_CLIENT_ID:}
google.forms.client-secret=${GOOGLE_CLIENT_SECRET:}
google.forms.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/google/callback}
# Optional background poll of Google responses (minutes); 0 disables it
google.forms.sync-interval-minutes=${GOOGLE_SYNC_MINUTES:0}

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
